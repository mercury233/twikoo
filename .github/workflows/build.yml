name: Build

on:
  push:
    branches: [mercury]
  pull_request:
    branches: [mercury]

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: twikoo-client
          path: dist/
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build backend image
        run: docker build --tag mercury233/twikoo:ci .
      - name: Export backend image
        run: docker save --output "${{ runner.temp }}/twikoo-server.tar" mercury233/twikoo:ci
      - uses: actions/upload-artifact@v7
        with:
          name: twikoo-server
          path: ${{ runner.temp }}/twikoo-server.tar
          if-no-files-found: error
